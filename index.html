<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSEEF SURCHI VIP - Server</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #131c31;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid #1f2d4d;
        }
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #00d2ff;
        }
        .subtitle-user {
            font-size: 14px;
            color: #ffcc00;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            box-sizing: border-box;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.png" alt="Logo">
        </div>

        <h1>YUSEEF SURCHI VIP</h1>
        <div class="subtitle-user">yuseef_sinan</div>
        <p>سەرڤەرێ فەرمی بۆ ماوەیێ 1 سالێ بێ کێشە</p>

        <a href="https://malazotkan-source.github.io/esign-dns/" class="btn">تنزيل ملف DNS (التثبيت الفوري)</a>
        
        <a href="repo.json" class="btn" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">وەرگرتنا فایلا Repo (JSON)</a>
    </div>

</body>
</html>
