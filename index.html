<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUSEEF SURCHI VIP APP</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #060913;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .main-card {
            max-width: 410px;
            margin: 15px auto;
            background: #0e1626;
            padding: 22px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
            border: 1px solid #1c2b4d;
        }
        .logo-box {
            width: 105px;
            height: 105px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 19px;
            margin: 5px 0 2px 0;
            color: #00d2ff;
        }
        .username-badge {
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        /* بەشێ ناڤێن سوشیال مێدیا یێن دیزاینکری */
        .custom-social {
            background: #141d33;
            border: 1px solid #21325b;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: right;
        }
        .social-heading {
            font-size: 11px;
            color: #00d2ff;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        .social-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0c1220;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #1a2748;
        }
        .social-row:last-child {
            margin-bottom: 0;
        }
        .social-text {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            direction: ltr;
        }
        .social-label {
            font-size: 11px;
            color: #8a9ba8;
        }

        /* پلەیەرێ قورئانێ */
        .quran-player {
            background: #141d33;
            border: 1px solid #21325b;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            height: 32px;
        }

        /* دوگمەیێن ئامێر و دابەزاندنێ */
        .tool-btn-card {
            background: #141d33;
            border: 1px solid #21325b;
            border-radius: 16px;
            padding: 12px 14px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            cursor: pointer;
        }
        .tool-info {
            display: flex;
            align-items: center;
            text-align: right;
        }
        .tool-icon {
            width: 44px;
            height: 44px;
            background: #0c1220;
            border-radius: 12px;
            overflow: hidden;
            margin-left: 12px;
            border: 1px solid #21345e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tool-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tool-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }
        .tool-sub {
            font-size: 11px;
            color: #8a9ba8;
        }
        .install-action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: 0.2s;
        }
        .install-action-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-box">
            <img src="logo.png" alt="Logo">
        </div>

        <h1>YUSEEF SURCHI VIP</h1>
        <div class="username-badge">yuseef_sinan</div>

        <div class="custom-social">
            <div class="social-heading">✨ MY CREATED ACCOUNTS ✨</div>
            
            <div class="social-row">
                <span class="social-text" style="color: #fffc00;">K4BOOS_SURCHI</span>
                <span class="social-label">Snapchat</span>
            </div>

            <div class="social-row">
                <span class="social-text" style="color: #00f2fe;">yuseef_surchi</span>
                <span class="social-label">TikTok</span>
            </div>

            <div class="social-row">
                <span class="social-text" style="color: #2aabee;">YUSEEF_SURCHI</span>
                <span class="social-label">Telegram</span>
            </div>
        </div>

        <div class="quran-player">
            <div style="font-size: 12px; color: #00d2ff; margin-bottom: 4px;">قران كريم بصوت جميل جدا 🎧</div>
            <audio controls>
                <source src="quran.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="tool-btn-card" onclick="startProcess('dns.mobileconfig', this)">
            <div class="tool-info">
                <div class="tool-icon">
                    <svg style="width:22px;height:22px;fill:#00d2ff;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div>
                    <div class="tool-name">Download DNS</div>
                    <div class="tool-sub">Required Security Tool</div>
                </div>
            </div>
            <button class="install-action-btn" id="b1">INSTALL</button>
        </div>

        <div class="tool-btn-card" onclick="startProcess('esign.ipa', this)">
            <div class="tool-info">
                <div class="tool-icon">
                    <img src="logo.png" alt="ESign">
                </div>
                <div>
                    <div class="tool-name">ESign VIP Custom</div>
                    <div class="tool-sub">Built & Designed by Yuseef</div>
                </div>
            </div>
            <button class="install-action-btn" id="b2">INSTALL</button>
        </div>

    </div>

    <script>
        function startProcess(targetUrl, element) {
            const btn = element.querySelector('.install-action-btn');
            if (btn.innerText.includes('%') || btn.innerText === 'DONE') return;

            let progress = 0;
            btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
            
            let interval = setInterval(() => {
                progress += 10;
                btn.innerText = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    btn.innerText = 'DONE';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 300);
                }
            }, 90);
        }
    </script>

</body>
</html>
