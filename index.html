<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUSEEF STORE - DNS & Social</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #04070f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .store-container {
            max-width: 410px;
            width: 100%;
            background: #0b111e;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.8);
            border: 1px solid #182440;
        }
        .store-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .store-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 19px;
            margin: 5px 0 2px 0;
            color: #00d2ff;
        }
        .store-tag {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .section-header {
            font-size: 13px;
            color: #00d2ff;
            text-align: right;
            margin: 15px 5px 8px 5px;
            font-weight: bold;
        }
        /* Social Media Box */
        .creator-box {
            background: #111a2e;
            border: 1px solid #1d2d50;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: right;
        }
        .creator-title {
            font-size: 11px;
            color: #00d2ff;
            margin-bottom: 8px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
        }
        .creator-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #080d19;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #16223d;
        }
        .creator-row:last-child {
            margin-bottom: 0;
        }
        .creator-val {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            direction: ltr;
        }
        .creator-key {
            font-size: 11px;
            color: #8a9ba8;
        }
        .app-item-card {
            background: #111a2e;
            border: 1px solid #1d2d50;
            border-radius: 16px;
            padding: 14px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            cursor: pointer;
        }
        .app-item-left {
            display: flex;
            align-items: center;
            text-align: right;
        }
        .app-item-icon {
            width: 45px;
            height: 45px;
            background: #080d19;
            border-radius: 12px;
            overflow: hidden;
            margin-left: 12px;
            border: 1px solid #1e3057;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-item-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }
        .app-item-desc {
            font-size: 11px;
            color: #8a9ba8;
        }
        .install-pub-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            min-width: 80px;
        }
    </style>
</head>
<body>

    <div class="store-container">
        <div class="store-logo">
            <img src="logo.png" alt="Logo">
        </div>
        <h1>YUSEEF STORE</h1>
        <div class="store-tag">DNS Security Platform</div>

        <div class="creator-box">
            <div class="creator-title">✨ DEVELOPER CHANNELS ✨</div>
            
            <div class="creator-row">
                <span class="creator-val" style="color: #fffc00;">K4BOOS_SURCHI</span>
                <span class="creator-key">Snapchat</span>
            </div>

            <div class="creator-row">
                <span class="creator-val" style="color: #00f2fe;">yuseef_surchi</span>
                <span class="creator-key">TikTok</span>
            </div>

            <div class="creator-row">
                <span class="creator-val" style="color: #2aabee;">YUSEEF_SURCHI</span>
                <span class="creator-key">Telegram</span>
            </div>
        </div>

        <div class="section-header">📦 ACTIVE PROFILE</div>

        <div class="app-item-card" onclick="publicInstall('dns.mobileconfig', this)">
            <div class="app-item-left">
                <div class="app-item-icon">
                    <svg style="width:22px;height:22px;fill:#00d2ff;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <div>
                    <div class="app-item-name">DNS Security Profile</div>
                    <div class="app-item-desc">Anti-Revoke Protection</div>
                </div>
            </div>
            <button class="install-pub-btn">INSTALL</button>
        </div>

    </div>

    <script>
        function publicInstall(targetUrl, element) {
            const btn = element.querySelector('.install-pub-btn');
            if (btn.innerText.includes('%') || btn.innerText === 'DONE') return;

            let progress = 0;
            btn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
            
            let interval = setInterval(() => {
                progress += 5;
                btn.innerText = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    btn.innerText = 'DONE';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 400);
                }
            }, 60);
        }
    </script>

</body>
</html>
